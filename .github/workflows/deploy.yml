# main 브랜치에 push 될 때마다 Tailwind CSS 를 빌드하고 Cloudflare Workers 에 배포합니다.
# 필요한 GitHub Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  — 배포 권한
#   TURNSTILE_SECRET_KEY, EMAILJS_PRIVATE_KEY    — 문의 폼 Worker 비밀 키 (배포 때 Worker secret 으로 바인딩)
name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      # 인라인 <script> 해시가 _headers 의 Content-Security-Policy 와 맞는지 확인합니다.
      - name: Check CSP hashes
        run: npm run check:csp

      # Worker secret 은 배포와 같은 버전에 함께 올립니다 (wrangler deploy --secrets-file).
      # 별도의 `wrangler secret bulk` 단계는 Cloudflare 에 배포되지 않은 버전이 남아 있으면
      # "latest version isn't currently deployed" 로 실패하므로 쓰지 않습니다.
      # 파일은 러너의 임시 디렉터리에만 만들어지고 저장소에는 남지 않습니다.
      - name: Write Worker secrets file
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
        run: |
          for name in TURNSTILE_SECRET_KEY EMAILJS_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret $name is empty or missing"; exit 1
            fi
          done
          jq -n --arg t "$TURNSTILE_SECRET_KEY" --arg e "$EMAILJS_PRIVATE_KEY" \
            '{TURNSTILE_SECRET_KEY: $t, EMAILJS_PRIVATE_KEY: $e}' > "$RUNNER_TEMP/worker-secrets.json"

      # package.json 에 고정된 wrangler 버전을 사용합니다.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json
