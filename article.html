<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article - 광명마리타임</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="광명마리타임 아티클" />
    <meta name="author" content="Gwangmyung Maritime" />

    <!-- Analytics (loaded via consent.js after user opt-in) -->
    <meta name="ga-id" content="G-CJMFQE9NT4" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="resource/gmmaritime.ico" />

    <!-- Theme (must run before body renders to avoid FOUC) -->
    <script src="assets/js/theme.js"></script>

    <!-- Google Fonts -->
    <!-- DNS prefetch for third-party assets -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var CJK = { ko: 'Noto+Sans+KR', zh: 'Noto+Sans+SC', ja: 'Noto+Sans+JP' };
        var lang = localStorage.getItem('preferredLanguage') || 'en';
        var families = ['Inter:wght@400;500;600;700', 'Space+Grotesk:wght@500;600;700'];
        if (CJK[lang]) families.push(CJK[lang] + ':wght@400;500;700');
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + families.join('&family=') + '&display=swap';
        document.head.appendChild(link);
      })();
    </script>

    <!-- Tailwind CSS (Built) -->
    <link rel="stylesheet" href="assets/css/output.css" />

    <!-- Lucide Icons -->
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.53.0/dist/umd/lucide.min.js"></script>

    <!-- EmailJS SDK (init lives in contact.js so it runs after defer resolves) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3.12.1/dist/email.min.js"></script>

    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 overflow-x-hidden transition-colors duration-300"
  >
    <!-- Country/Language Detection Modal (loaded dynamically) -->
    <div id="country-modal-placeholder"></div>

    <!-- Navigation (loaded dynamically) -->
    <div id="navbar-placeholder"></div>
    <a id="main-content" tabindex="-1"></a>

    <!-- Hero Section (Article Meta) -->
    <section class="pt-32 pb-16 bg-ocean-900">
      <div class="max-w-3xl mx-auto px-6">
        <a
          href="articles.html"
          class="inline-flex items-center gap-2 text-ocean-200 hover:text-white text-sm font-medium mb-8 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          Back to Articles
        </a>
        <div id="article-meta">
          <!-- Article meta will be rendered here by JS -->
        </div>
      </div>
    </section>

    <!-- Article Content (always light background for readability) -->
    <section class="py-16 bg-white">
      <div class="max-w-3xl mx-auto px-6">
        <div
          id="article-content"
          class="prose max-w-none text-slate-700"
        >
          <!-- Article content will be rendered here by JS -->
          <div class="text-center py-16">
            <div class="animate-pulse text-slate-400">Loading...</div>
          </div>
        </div>

        <!-- End-of-article CTA (shown once the article has loaded) -->
        <aside
          id="article-cta"
          class="hidden mt-16 rounded-2xl border border-ocean-100 bg-ocean-50 p-8 md:p-10"
          aria-labelledby="article-cta-title"
        >
          <h2
            id="article-cta-title"
            class="font-display text-xl md:text-2xl font-bold text-slate-900 leading-snug"
            data-i18n="articleCta.title"
          >
            이 글의 내용, 귀사 선박에 어떻게 적용될지 궁금하신가요?
          </h2>
          <p class="mt-3 text-slate-600" data-i18n="articleCta.desc">
            규정 대응부터 보안 설계까지, 프로젝트 상황에 맞춰 함께 검토해 드립니다.
          </p>
          <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-4">
            <a
              href="index.html#contact"
              class="inline-flex items-center gap-2 whitespace-nowrap rounded-md bg-signal-400 px-5 py-3 text-sm font-semibold text-ink-950 hover:bg-signal-300 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ocean-500"
            >
              <span data-i18n="articleCta.button">상담 문의하기</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
            <a
              id="article-cta-service"
              href="index.html#competitiveness"
              class="hidden inline-flex items-center gap-1.5 whitespace-nowrap text-sm font-semibold text-ocean-700 hover:text-ocean-900 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ocean-500"
            >
              <span data-i18n="articleCta.service">관련 서비스 보기</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
          </div>
        </aside>
      </div>
    </section>

    <!-- Footer (loaded dynamically) -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript Files -->
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/contact.js"></script>
    <script src="assets/js/articles.js"></script>
    <script src="assets/js/country-detector.js"></script>
    <script src="assets/js/consent.js"></script>
    <script>
      // Runs after every render, including re-renders on language change.
      // Reveal the end-of-article CTA and point its secondary link at the
      // service page that matches the article's category.
      document.addEventListener('articleRendered', ({ detail: { meta } }) => {
        const servicePage = {
          Regulation: 'compliance.html',
          Compliance: 'compliance.html',
          'Threat Intelligence': 'maritime-cybersecurity.html',
        }[meta.category];
        const service = document.getElementById('article-cta-service');
        if (servicePage && service) {
          service.href = servicePage;
          service.classList.remove('hidden');
        }
        document.getElementById('article-cta')?.classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      });

      document.addEventListener('DOMContentLoaded', () => {
        window.articlesManager.renderArticleDetail('article-meta', 'article-content');
      });
    </script>
  </body>
</html>
