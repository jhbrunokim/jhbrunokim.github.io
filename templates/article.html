<!DOCTYPE html>
<!--
  아티클 페이지 템플릿. scripts/build-articles.mjs 가 articles/index.json 과 articles/*.md 를 읽어
  articles/<slug>.html (ko) · articles/<slug>.<lang>.html (en · zh · ja) 로 만들어 냅니다.
  {{name}} 은 HTML 이스케이프된 값, {{{name}}} 은 원문 HTML 입니다.
  생성된 파일은 git 에 올리지 않습니다 (npm run build 가 만듭니다).
-->
<html lang="{{lang}}" data-page-lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 이 페이지는 /articles/ 아래에 있으므로 상대 경로(컴포넌트 · 번역 · 링크)를 루트 기준으로 풉니다. -->
    <base href="/" />
    <title>{{title}} - {{siteName}}</title>

    <!-- SEO Meta Tags -->
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Gwangmyung Maritime" />
    <link rel="canonical" href="{{canonical}}" />
{{{alternates}}}

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{canonical}}" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:image" content="https://gmmaritime.com/resource/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="article:published_time" content="{{date}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" />
    <meta name="twitter:description" content="{{description}}" />
    <meta name="twitter:image" content="https://gmmaritime.com/resource/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
{{{jsonLd}}}
    </script>

    <!-- Analytics (loaded via consent.js after user opt-in) -->
    <meta name="ga-id" content="G-CJMFQE9NT4" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="resource/gmmaritime.ico" />

    <!-- Theme (must run before body renders to avoid FOUC) -->
    <script src="assets/js/theme.js"></script>

    <!-- Google Fonts -->
    <!-- DNS prefetch for third-party assets -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        var CJK = { ko: 'Noto+Sans+KR', zh: 'Noto+Sans+SC', ja: 'Noto+Sans+JP' };
        var lang = localStorage.getItem('preferredLanguage') || (function () {
          // Same rule as detectBrowserLanguage() in assets/js/i18n.js
          var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
          for (var i = 0; i < tags.length; i++) {
            var primary = String(tags[i] || '').toLowerCase().split('-')[0];
            if (primary === 'ko' || primary === 'zh' || primary === 'ja') return primary;
          }
          return 'en';
        })();
        var families = ['Inter:wght@400;500;600;700', 'Space+Grotesk:wght@500;600;700'];
        if (CJK[lang]) families.push(CJK[lang] + ':wght@400;500;700');
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=' + families.join('&family=') + '&display=swap';
        document.head.appendChild(link);
      })();
    </script>

    <!-- Tailwind CSS (Built) -->
    <link rel="stylesheet" href="assets/css/output.css" />

    <!-- Lucide Icons -->
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@1.53.0/dist/umd/lucide.min.js"></script>

    <!-- Cloudflare Turnstile (contact form bot check; widgets are rendered by contact.js) -->
    <script defer src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=__turnstileReady"></script>
  </head>
  <body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 overflow-x-hidden transition-colors duration-300"
  >
    <!-- Country/Language Detection Modal (loaded dynamically) -->
    <div id="country-modal-placeholder"></div>

    <!-- Navigation (loaded dynamically) -->
    <div id="navbar-placeholder"></div>
    <a id="main-content" tabindex="-1"></a>

    <!-- Hero Section (Article Meta) -->
    <section class="pt-32 pb-16 bg-ocean-900">
      <div class="max-w-3xl mx-auto px-6">
        <a
          href="articles.html"
          class="inline-flex items-center gap-2 text-ocean-200 hover:text-white text-sm font-medium mb-8 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          <span data-i18n="articlesUi.back">{{uiBack}}</span>
        </a>
        <div id="article-meta">
          <div class="flex items-center gap-x-3 text-sm text-slate-300 mb-4">
            <time datetime="{{date}}">{{dateText}}</time>
{{{categoryBadge}}}
          </div>
          <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">{{title}}</h1>
          <p class="text-slate-300 text-lg">{{description}}</p>
{{{authorLine}}}
        </div>
      </div>
    </section>

    <!-- Article Content (always light background for readability) -->
    <section class="py-16 bg-white">
      <div class="max-w-3xl mx-auto px-6">
        <article id="article-content" class="prose max-w-none text-slate-700">
{{{content}}}
        </article>

        <!-- End-of-article CTA -->
        <aside
          id="article-cta"
          class="mt-16 rounded-2xl border border-ocean-100 bg-ocean-50 p-8 md:p-10"
          aria-labelledby="article-cta-title"
        >
          <h2
            id="article-cta-title"
            class="font-display text-xl md:text-2xl font-bold text-slate-900 leading-snug"
            data-i18n="articleCta.title"
          >
            {{ctaTitle}}
          </h2>
          <p class="mt-3 text-slate-600" data-i18n="articleCta.desc">
            {{ctaDesc}}
          </p>
          <div class="mt-8 flex flex-wrap items-center gap-x-6 gap-y-4">
            <a
              href="index.html#contact"
              class="inline-flex items-center gap-2 whitespace-nowrap rounded-md bg-signal-400 px-5 py-3 text-sm font-semibold text-ink-950 hover:bg-signal-300 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ocean-500"
            >
              <span data-i18n="articleCta.button">{{ctaButton}}</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </a>
{{{ctaServiceLink}}}
          </div>
        </aside>
      </div>
    </section>

    <!-- Footer (loaded dynamically) -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript Files -->
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/contact.js"></script>
    <script src="assets/js/country-detector.js"></script>
    <script src="assets/js/consent.js"></script>
  </body>
</html>
