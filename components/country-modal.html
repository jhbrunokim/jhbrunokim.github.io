<!-- Country/Language Detection Modal -->
<div
  id="country-modal"
  class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm"
>
  <div
    class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 text-center"
  >
    <div class="mb-6">
      <i
        data-lucide="globe"
        class="w-12 h-12 text-blue-500 mx-auto mb-4"
      ></i>
      <h2
        class="text-2xl font-bold text-slate-900 dark:text-white mb-2"
        id="modal-title"
      >
        <span data-i18n="countryModal.detectedMessage"
          >You are connecting from</span
        >
      </h2>
      <p
        class="text-3xl font-bold text-blue-600 dark:text-blue-400"
        id="detected-country-name"
      >
        Korea
      </p>
    </div>

    <!-- Country Selection Dropdown (Initially Hidden) -->
    <div class="mb-6 hidden" id="country-dropdown-container">
      <select
        id="country-select"
        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white"
      >
        <option value="KR" data-i18n="countryModal.countries.KR">
          대한민국 (Korea)
        </option>
        <option value="US" data-i18n="countryModal.countries.US">
          United States
        </option>
        <option value="CN" data-i18n="countryModal.countries.CN">
          中国 (China)
        </option>
        <option value="JP" data-i18n="countryModal.countries.JP">
          日本 (Japan)
        </option>
      </select>
    </div>

    <!-- Action Buttons -->
    <div class="space-y-3">
      <button
        id="modal-continue"
        class="w-full px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold transition-all shadow-lg"
      >
        <span data-i18n="countryModal.continueButton">Continue</span>
      </button>
      <button
        id="select-other"
        class="w-full px-6 py-3 bg-transparent border border-slate-300 dark:border-slate-700 hover:border-slate-400 dark:hover:border-slate-600 text-slate-700 dark:text-slate-300 rounded-lg font-medium transition-all"
      >
        <span data-i18n="countryModal.selectOther"
          >Select other country or region</span
        >
      </button>
    </div>
  </div>
</div>
