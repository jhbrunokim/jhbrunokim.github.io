<!-- Language Chooser Modal (opened from the navbar globe buttons) -->
<div
  id="country-modal"
  class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm"
>
  <div
    id="country-modal-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    tabindex="-1"
    class="relative focus:outline-none bg-white dark:bg-slate-800 rounded-2xl shadow-2xl max-w-md w-full mx-4 p-8 text-center"
  >
    <button
      type="button"
      id="modal-close"
      class="absolute top-4 end-4 p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors"
      aria-label="닫기"
      data-i18n-aria-label="countryModal.closeButton"
    >
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <div class="mb-6">
      <i
        data-lucide="globe"
        class="w-12 h-12 text-ocean-600 mx-auto mb-4"
      ></i>
      <h2
        class="text-2xl font-bold text-slate-900 dark:text-white"
        id="modal-title"
        data-i18n="countryModal.title"
      >
        언어 선택
      </h2>
    </div>

    <!-- Language Selection: options are language autonyms, not translated -->
    <div class="mb-6" id="country-dropdown-container">
      <select
        id="country-select"
        aria-labelledby="modal-title"
        class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-ocean-500 text-slate-900 dark:text-white"
      >
        <option value="ko" lang="ko">한국어</option>
        <option value="en" lang="en">English</option>
        <option value="zh" lang="zh">中文</option>
        <option value="ja" lang="ja">日本語</option>
      </select>
    </div>

    <!-- Action Button -->
    <button
      type="button"
      id="modal-continue"
      class="w-full px-6 py-3 bg-ocean-700 hover:bg-ocean-800 text-white rounded-lg font-semibold transition-all shadow-lg"
    >
      <span data-i18n="countryModal.continueButton">계속</span>
    </button>
  </div>
</div>
